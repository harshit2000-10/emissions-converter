name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:win
      - name: Install silently, then check the installed app loads, saves and cannot reach the network
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Emissions Converter.exe' | Select-Object -First 1
          if (-not $exe) { throw 'The installer did not install the app' }
          # a copy that is already open would make the check exit at once without checking anything
          if (Get-Process 'Emissions Converter' -ErrorAction SilentlyContinue) { throw 'The app is already running' }
          $env:DESKTOP_CHECK = '1'
          $p = Start-Process $exe.FullName -Wait -PassThru -RedirectStandardOutput check.json
          Get-Content check.json
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
      - name: Attach the installer to a release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create $env:GITHUB_REF_NAME (Get-Item release/*Setup*.exe).FullName --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
